AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Cursor Changelog Tracker

  Serverless application to track Cursor changelog with email notifications

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Runtime: python3.10
    Architectures:
      - x86_64
    Environment:
      Variables:
        LOG_LEVEL: INFO
        DYNAMODB_TABLE_NAME: !Ref ChangelogVersionsTable
        SES_REGION: !Ref AWS::Region

Resources:
  ChangelogVersionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cursor-changelog-versions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: version_id
          AttributeType: S
      KeySchema:
        - AttributeName: version_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  FetchChangelogFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handler.fetch_changelog.handler.lambda_handler
      Description: Fetches and processes Cursor changelog with email notifications
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChangelogVersionsTable
        - SESCrudPolicy:
            IdentityName: "*"
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 7 * * ? *)
            Description: Runs daily at 07:00 UTC
            Enabled: true

Outputs:
  FetchChangelogFunction:
    Description: "Fetch Changelog Lambda Function ARN"
    Value: !GetAtt FetchChangelogFunction.Arn
  FetchChangelogFunctionRole:
    Description: "Implicit IAM Role created for the function"
    Value: !GetAtt FetchChangelogFunctionRole.Arn
  ChangelogVersionsTable:
    Description: "DynamoDB table for tracking notified versions"
    Value: !Ref ChangelogVersionsTable
  ChangelogVersionsTableArn:
    Description: "DynamoDB table ARN"
    Value: !GetAtt ChangelogVersionsTable.Arn
