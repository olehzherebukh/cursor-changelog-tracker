[tool.poetry]
name = "cursor-changelog-tracker"
version = "0.1.0"
description = "Serverless application to track Cursor changelog"
authors = ["Devin AI"]
readme = "README.md"
packages = [{include = "backend"}]

[tool.poetry.dependencies]
python = "^3.10.13"
httpx = "^0.28.1"
beautifulsoup4 = "^4.12.3"
lxml = "^5.1.0"
pydantic-settings = "^2.2.1"
aws-lambda-powertools = "^2.32.0"
boto3 = "^1.38.23"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
mypy = "^1.15.0"
ruff = "^0.11.11"
black = "^25.1.0"
pre-commit = "^4.2.0"
pytest = "^7.4.4"
pytest-mock = "^3.12.0"
types-beautifulsoup4 = "^4.12.0.20250516"
